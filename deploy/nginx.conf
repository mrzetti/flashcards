server {
    listen 80;
    listen [::]:80;
    server_name FLASHCARDS_HOST;
    root /var/www/flashcards;
    index index.html;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # Revalidate every file with ETag/If-Modified-Since. The catalog, launcher
    # and artwork are updated in place without hashed filenames, so browsers
    # (especially mobile ones) must not keep using a stale copy after a deploy.
    add_header Cache-Control "no-cache" always;
    location ~ \.wasm$ {
        types { application/wasm wasm; }
        try_files $uri =404;
    }
    location / { try_files $uri $uri/ =404; }
    location ~ /\. { deny all; }
}
